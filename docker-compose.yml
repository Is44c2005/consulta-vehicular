# Entorno local completo: Redis + 3 microservicios.
# Para usar Redis en la nube (Upstash) en lugar del contenedor, defina REDIS_URL en un archivo .env:
#   REDIS_URL=rediss://default:<token>@<host>.upstash.io:6379
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  sri-service:
    build:
      context: ./backend
      args:
        MODULE: sri-service
    environment:
      PORT: 8081
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "8081:8081"
    depends_on:
      - redis

  ant-service:
    build:
      context: ./backend
      args:
        MODULE: ant-service
    environment:
      PORT: 8082
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "8082:8082"
    depends_on:
      - redis

  api-gateway:
    build:
      context: ./backend
      args:
        MODULE: api-gateway
    environment:
      PORT: 8080
      SRI_SERVICE_URL: http://sri-service:8081
      ANT_SERVICE_URL: http://ant-service:8082
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      - sri-service
      - ant-service
